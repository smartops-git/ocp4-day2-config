apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeSet
metadata:
  name: localvolumeset
  namespace: openshift-local-storage
spec:
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - worker1.ocp.lab.kuberox.net
              - worker2.ocp.lab.kuberox.net
              - worker3.ocp.lab.kuberox.net
  storageClassName: local-sc
  volumeMode: Filesystem
  fsType: xfs
  maxDeviceCount: 1
  deviceInclusionSpec:
    deviceTypes:
      - disk
    minSize: 190G
    maxSize: 210G
